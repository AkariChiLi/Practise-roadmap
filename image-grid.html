<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Grid</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .grid{
            display: grid;
            gap: 20px;
            grid-auto-rows:160px;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-flow: dense;
        }

        .grid-img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .mountain{
            grid-row: 1 / 3;
            grid-column: 1
        }

         .door{
            grid-row: 2 / 4;
            grid-column: 2
        }

         .street{
            grid-row: span 2;
            grid-column: 3
        }
    </style>
</head>
<body>
    <div class="grid">

        <div class="mountain">
            <img class="grid-img" src="mountain.png" alt="mountain">
        </div>

        <div class="food">
            <img class="grid-img" src="food.png" alt="food">
        </div>

          <div class="street">
            <img class="grid-img" src="street.png" alt="street">
        </div>

        <div class="room">
            <img class="grid-img" src="room.png" alt="room">
        </div>

        <div class="door">
            <img class="grid-img" src="door.png" alt="door">
        </div>

        <div class="sea">
            <img class="grid-img" src="sea.png" alt="sea">
        </div>

    </div>
</body>

</html>
