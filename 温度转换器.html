<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>温度转换器</title>
</head>
<body>
    <div class="choose">
        <label for="class">类别：</label>
          <input type="radio" name="class" id="celsius" checked>
          <label for="celsius">摄氏度</label>
          <input type="radio" name="class" id="fahrenheit" >
          <label for="fahrenheit">华氏度</label>
    </div>

    <div class="input">
        <label for="input">输入：</label>
        <input type="text" id="input" name="input">
        <button id="button">转换</button>
    </div>

    <div class="output">
        <label for="output">输出：</label>
        <input type="text" id="output" name="output" readonly>
    </div>

<script src="/Project/practise/温度转化器.js"></script>
</body>
</html>
